services:
  jaf-db:
    image: postgres:16
    container_name: jaf-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-jaf_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jaf_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s


  ocr-service:
    build: ./POC-API
    container_name: ocr-service
    env_file:
      - .env
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./jaf-backend
    container_name: jaf-backend
    restart: on-failure:5
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://jaf-db:5432/${DB_NAME:-jaf_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      OCR_SERVICE_URL: "http://ocr-service:8000/api/ocr"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      ocr-service:
        condition: service_started
      jaf-db:
        condition: service_healthy

  backend-test:
    build:
      context: ./jaf-backend
      target: build
    container_name: jaf-backend-test
    command: ./mvnw clean test
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
      SPRING_DATASOURCE_URL: "jdbc:postgresql://jaf-db:5432/${DB_NAME:-jaf_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      jaf-db:
        condition: service_healthy

  frontend:
    build:
      context: ./jaf-frontend/react
      args:
        VITE_API_URL: /api
    container_name: jaf-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: