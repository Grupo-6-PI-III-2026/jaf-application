services:
  jaf-db:
    image: postgres:16
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    container_name: jaf-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-jaf_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jaf_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s


  ocr-service:
    build: ./POC-API
    container_name: ocr-service
    env_file:
      - .env
    ports:
      - "8000:8000"

  ocr-worker:
    build: ./POC-API
    container_name: ocr-worker
    restart: always
    command: ["python", "-u", "-m", "app.infrastructure.messaging.consumer"]
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build:
      context: ./jaf-backend
    container_name: jaf-backend
    restart: on-failure:5
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://jaf-db:5432/${DB_NAME:-jaf_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      OCR_SERVICE_URL: "http://ocr-service:8000/api/ocr"
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      ocr-service:
        condition: service_started
      jaf-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./jaf-backend
      target: build
    container_name: jaf-backend-test
    command: ./mvnw clean test
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
      SPRING_DATASOURCE_URL: "jdbc:postgresql://jaf-db:5432/${DB_NAME:-jaf_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      jaf-db:
        condition: service_healthy

  frontend:
    build:
      context: ./jaf-frontend/react
      args:
        VITE_API_URL: /api
    container_name: jaf-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes: 
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  rabbitmq_data: