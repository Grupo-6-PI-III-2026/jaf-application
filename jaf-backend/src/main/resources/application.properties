spring.application.name=jaf-application

# Banco: PostgreSQL (RDS na AWS) — sobrescrito em produção via variável SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# FLYWAY — mesmas credenciais do datasource, usando PostgreSQL
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8080}
app.cors.allowed-origins=http://localhost:5173,http://localhost,http://localhost:80
spring.main.allow-bean-definition-overriding=true
app.seed.enabled=${APP_SEED_ENABLED:true}

# Actuator — health check para ALB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# OCR/RabbitMQ indisponível não pode tirar a API inteira do load balancer
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db


server.error.include-message=always
server.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Armazenamento de fotos e notas fiscais: local (disco, desenvolvimento) ou s3 (AWS)
app.armazenamento.tipo=${ARMAZENAMENTO_TIPO:local}
app.armazenamento.url-validade-minutos=${ARMAZENAMENTO_URL_VALIDADE_MINUTOS:15}
app.armazenamento.local.diretorio=${ARMAZENAMENTO_LOCAL_DIRETORIO:uploads}
# Prefixo pelo qual o navegador alcança o backend (nginx e Vite removem o /api)
app.armazenamento.local.url-publica=${ARMAZENAMENTO_LOCAL_URL_PUBLICA:/api}
app.armazenamento.local.segredo=${ARMAZENAMENTO_LOCAL_SEGREDO:${JWT_SECRET:}}
app.armazenamento.s3.bucket=${ARMAZENAMENTO_S3_BUCKET:}
app.armazenamento.s3.regiao=${AWS_REGION:us-east-1}
app.armazenamento.s3.endpoint=${ARMAZENAMENTO_S3_ENDPOINT:}

# RabbitMQ (OCR assíncrono via worker Python)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Sem retry limitado, uma falha no listener devolveria o resultado à fila em loop infinito
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.validity=${JWT_EXPIRATION}

# 
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8000/api/ocr}
