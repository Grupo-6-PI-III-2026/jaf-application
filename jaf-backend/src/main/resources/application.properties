spring.application.name=jaf-application

# Banco: PostgreSQL (RDS na AWS) — sobrescrito em produção via variável SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# FLYWAY — mesmas credenciais do datasource, usando PostgreSQL
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

server.port=${PORT:8080}
app.cors.allowed-origins=http://localhost:5173,http://localhost,http://localhost:80
spring.main.allow-bean-definition-overriding=false
app.seed.enabled=${APP_SEED_ENABLED:false}
app.gasto.restringir-autor=${APP_GASTO_RESTRINGIR_AUTOR:false}
app.security.trusted-proxy-hops=${APP_TRUSTED_PROXY_HOPS:1}
server.error.include-message=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:3600}
app.security.cookie.secure=${APP_COOKIE_SECURE:true}
app.security.cookie.same-site=${APP_COOKIE_SAMESITE:Strict}
app.security.cookie.max-age=${JWT_EXPIRATION:3600}s
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Actuator — health check para ALB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# OCR/RabbitMQ indisponível não pode tirar a API inteira do load balancer
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# RabbitMQ (OCR assíncrono via worker Python)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Sem retry limitado, uma falha no listener devolveria o resultado à fila em loop infinito
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s

# JWT Configuration
# 
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:uploads}
app.ocr.timeout=${APP_OCR_TIMEOUT:PT3M}
management.endpoints.web.exposure.include=health,prometheus

# requestId em todas as linhas de log (RequestIdFilter) para correlacionar as chamadas
logging.pattern.level=%5p [%X{requestId:-}]
