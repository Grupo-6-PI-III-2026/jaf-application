spring.application.name=jaf-application

# Banco: PostgreSQL (RDS na AWS) — sobrescrito em produção via variável SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# FLYWAY — mesmas credenciais do datasource, usando PostgreSQL
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jaf_db}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${PORT:8080}
app.cors.allowed-origins=http://localhost:5173,http://localhost,http://localhost:80
spring.main.allow-bean-definition-overriding=true
app.seed.enabled=${APP_SEED_ENABLED:true}


server.error.include-message=always
server.error.include-binding-errors=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ocr.space.api-key=${OCR_SPACE_API_KEY:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.validity=${JWT_EXPIRATION}

# 
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8000/api/ocr}
