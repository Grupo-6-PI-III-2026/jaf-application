name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaf-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O runner traz Docker, então MigracoesPostgresTest roda contra um PostgreSQL real (Testcontainers).
      - name: Testes do backend
        run: ./mvnw -B -ntp test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaf-frontend/react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jaf-frontend/react/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run
