# O TLS termina no ALB: preserva o protocolo original informado por ele.
map $http_x_forwarded_proto $proxy_xfp {
    default $http_x_forwarded_proto;
    ""        $scheme;
}

map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 11m;

    # Template do entrypoint oficial: ALB interno troca de IP e containers são recriados.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend http://${BACKEND_HOST}:8080;

    # ── Timeouts ───────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ── Buffers ────────────────────────────────────────────────
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;


    # ── Compressão Gzip ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # ── Logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ── Health check endpoint ───────────────────────────────────
    location /health {
        include snippets/security.conf;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Arquivos estáticos do React ────────────────────────────
    location / {
        include snippets/security.conf;
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Bundles com hash ficam na raiz de /assets/ e podem ser cacheados por um ano.
    location ~ ^/assets/[^/]+$ {
        include snippets/security.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Subpastas (logo, avatares, fundos) não têm hash no nome.
    location /assets/ {
        include snippets/security.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    }

    # ── Proxy para API do Backend ───────────────────────────────
    location /api/ {
        include snippets/security.conf;
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $backend;
        proxy_http_version 1.1;

        # Headers padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_xfp;
        proxy_set_header Connection "";

        # Headers adicionais para melhor compatibilidade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Sem cache para respostas da API
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }

    # ── Proxy para uploads ───────────────────────────────────────
    location /uploads/ {
        include snippets/security.conf;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_xfp;
        proxy_set_header Connection "";

        # Conteúdo autenticado: não pode ser guardado por caches compartilhados.
        add_header Cache-Control "private, max-age=86400" always;
    }
}